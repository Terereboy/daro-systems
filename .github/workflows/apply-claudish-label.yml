name: Apply Claudish label

on:
  push:
    branches: [main]
    paths:
      - 'english-progress-data.js'
  pull_request:
    paths:
      - 'english-progress-data.js'

permissions:
  contents: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          # fetch-depth: 0 trae el historial completo. El script necesita
          # el commit ANTERIOR (git show HEAD~1:...) para saber si la
          # práctica diaria de hoy ya tenía sesiones cargadas antes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Claudish label + daily practice aggregation
        run: node scripts/apply-claudish-label.js

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-apply Claudish label + daily practice"
          file_pattern: english-progress-data.js
